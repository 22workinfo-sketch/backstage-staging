# ============================================================
# Botdesk Bot Runner — Docker Compose
# Run with: docker compose -f docker-compose.bot.yml up -d --build
# ============================================================

services:
  botdesk-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: botdesk-bot-runner
    restart: unless-stopped

    # Automatically apply any pending database migrations before starting bot runner
    command: sh -c "npx prisma migrate deploy && node node_modules/tsx/dist/cli.mjs src/bot/index.ts"

    # All secrets come from the .env file on the VPS (never committed to git)
    env_file:
      - .env

    # Logging: keep last 50 MB, rotate every 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # No ports needed — bot uses long polling (Telegram reaches out to us, not vice versa)
    # No Traefik labels needed — this is a background worker, not a web service

    # Healthcheck: verify the process is still alive
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
